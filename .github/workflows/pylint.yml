name: pylint

on:
  push:
    branches: [ devel ]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # apt (python3-apt) and pyinotify are not installed: they are listed in ignored-modules (.pylintrc)
      - name: Install pylint and dependencies
        run: pip install pylint tabulate colorama python-dateutil PyYAML simplejson distro requests websocket-client psutil rich

      - name: Print pylint version
        run: pylint --version

      # Run from the repository root so that .pylintrc is used
      - name: Detect coding standard violations
        run: pylint --recursive=y . --fail-under=9.9
