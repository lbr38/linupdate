name: Build and test deb package

on:
  push:
    branches: [ devel ]

jobs:
  # Build a deb package
  build-deb:
    name: Build deb package
    runs-on: ubuntu-latest
    container:
      image: debian:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      - name: Install dependencies packages
        run: apt-get update && apt-get install build-essential binutils lintian debhelper dh-make devscripts curl -y

      - name: Create build environment
        run: |
          mkdir -p /tmp/linupdate-build/DEBIAN
          mkdir -p /tmp/linupdate-build/etc/linupdate/modules
          mkdir -p /tmp/linupdate-build/opt/linupdate
          mkdir -p /tmp/linupdate-build/opt/linupdate/src/
          mkdir -p /tmp/linupdate-build/opt/linupdate/templates/

      - name: Copy files to include in the build
        run: |
          cp -r ${GITHUB_WORKSPACE}/src/* /tmp/linupdate-build/opt/linupdate/src/
          cp -r ${GITHUB_WORKSPACE}/templates/* /tmp/linupdate-build/opt/linupdate/templates/
          cp ${GITHUB_WORKSPACE}/linupdate.py /tmp/linupdate-build/opt/linupdate/linupdate.py
          cp ${GITHUB_WORKSPACE}/service.py /tmp/linupdate-build/opt/linupdate/service.py
          cp ${GITHUB_WORKSPACE}/version /tmp/linupdate-build/opt/linupdate/version

      - name: Copy control file
        run: |
          cp ${GITHUB_WORKSPACE}/.github/workflows/packaging/deb/control /tmp/linupdate-build/DEBIAN/control
          sed -i "s/__VERSION__/${{ env.VERSION }}/g" /tmp/linupdate-build/DEBIAN/control

      - name: Copy maintainer scripts
        run: |
          for script in preinst postinst prerm postrm; do
            cp ${GITHUB_WORKSPACE}/.github/workflows/packaging/deb/${script} /tmp/linupdate-build/DEBIAN/${script}
            chmod 755 /tmp/linupdate-build/DEBIAN/${script}
          done

      # Changelog of the current version, from CHANGELOG.md (changelog.gz: name of the changelog of a native package)
      - name: Generate changelog
        run: |
          mkdir -p /tmp/linupdate-build/usr/share/doc/linupdate
          bash ${GITHUB_WORKSPACE}/.github/scripts/generate-changelog.sh deb /tmp/linupdate-changelog
          gzip -9 -n -c /tmp/linupdate-changelog > /tmp/linupdate-build/usr/share/doc/linupdate/changelog.gz

      - name: Build package
        run: |
          cd /tmp
          dpkg-deb --build linupdate-build
          mv /tmp/linupdate-build.deb /tmp/linupdate-test-build_${{ env.VERSION }}_all.deb

      # Fail on new lintian errors (the accepted ones are listed in lintian-suppressed-tags)
      - name: Check package with lintian
        run: lintian --fail-on error --suppress-tags-from-file ${GITHUB_WORKSPACE}/.github/workflows/packaging/deb/lintian-suppressed-tags /tmp/linupdate-test-build_${{ env.VERSION }}_all.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linupdate-test-build_${{ env.VERSION }}_all.deb
          path: /tmp/linupdate-test-build_${{ env.VERSION }}_all.deb
          retention-days: 1


  # Upload deb package to test repositories
  upload:
    name: Upload deb package to test repositories
    needs:
      - build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      # Download builded deb package artifact
      - name: Download deb artifact
        uses: actions/download-artifact@v8
        with:
          name: linupdate-test-build_${{ env.VERSION }}_all.deb
          path: ~/assets

      # Upload package to test repositories
      - name: Upload packages to test repositories
        run: |
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build_${{ env.VERSION }}_all.deb" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/974/upload
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build_${{ env.VERSION }}_all.deb" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/975/upload
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build_${{ env.VERSION }}_all.deb" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/976/upload
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build_${{ env.VERSION }}_all.deb" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/977/upload
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build_${{ env.VERSION }}_all.deb" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/978/upload
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build_${{ env.VERSION }}_all.deb" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/979/upload

      # Rebuild repositories metadata
      - name: Rebuild repositories
        run: |
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/974/rebuild
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/975/rebuild
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/976/rebuild
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/977/rebuild
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/978/rebuild
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/979/rebuild


  # Install the package and run the test suite on different distributions
  # (the OS specific preparation is done by .github/scripts/setup-system.sh)
  install-and-test:
    name: Install and test on ${{ matrix.name }}
    needs:
      - build-deb
      - upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linupdate 3 is not working on Debian 10
          # Debian 11 (EOL) fails on packages update test
          # - name: Debian 11
          #   image: debian:11
          - name: Debian 12
            # Intentionally using an old image to have a list of packages to update
            image: debian:bookworm-20260518
          - name: Debian 13
            image: debian:13
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Ubuntu 26.04
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      - name: Prepare system
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/setup-system.sh

      # Download builded package artifact
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: linupdate-test-build_${{ env.VERSION }}_all.deb

      - name: Install package
        run: apt-get install -y ./linupdate-test-build_${{ env.VERSION }}_all.deb

      # Run common test suite (shared across all distributions)
      - name: Run test suite
        env:
          REPOSITORY_TEST_URL: ${{ secrets.REPOSITORY_TEST_URL }}
          REPOSITORY_TEST_TOKEN: ${{ secrets.REPOSITORY_TEST_TOKEN }}
          REPOS_CONFIG_DIR: /etc/apt/sources.list.d
          LINUPDATE_PROFILE: linupdate-ci-debian-systems
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/run-tests.sh

  # Upgrade from the latest release, systemd service and uninstall tests, in a container running systemd
  package-tests:
    name: Package tests on ${{ matrix.name }}
    needs:
      - build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      # Download builded package artifact
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: linupdate-test-build_${{ env.VERSION }}_all.deb
          path: packages/new

      - name: Download the latest released package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern '*_all.deb' --dir packages/old

      - name: Start a container running systemd
        run: bash .github/scripts/start-systemd-container.sh "${{ matrix.image }}" linupdate-systemd

      - name: Run package tests
        env:
          REPOSITORY_TEST_URL: ${{ secrets.REPOSITORY_TEST_URL }}
          REPOSITORY_TEST_TOKEN: ${{ secrets.REPOSITORY_TEST_TOKEN }}
        run: |
          docker exec -e REPOSITORY_TEST_URL -e REPOSITORY_TEST_TOKEN linupdate-systemd \
            bash /src/.github/scripts/run-package-tests.sh /src/packages/new/linupdate-test-build_${{ env.VERSION }}_all.deb /src/packages/old

      - name: Print the service journal
        if: always()
        run: docker exec linupdate-systemd journalctl -u linupdate --no-pager --all || true
