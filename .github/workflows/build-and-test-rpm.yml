name: Build and test rpm package

on:
  push:
    branches: [ devel ]

jobs:
  # Build a rpm package
  build-rpm:
    name: Build rpm package
    runs-on: ubuntu-latest
    container:
      image: centos:8
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      - name: Install CentOS8 archive repositories
        run: |
          rm /etc/yum.repos.d/* -f

          echo "[os]
          name=os repo
          baseurl=https://vault.centos.org/8-stream/BaseOS/x86_64/os/
          enabled=1
          gpgkey=https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official-SHA256
          gpgcheck=1" > /etc/yum.repos.d/os.repo

          echo "[appstream]
          name=updates repo
          baseurl=https://vault.centos.org/8-stream/AppStream/x86_64/os/
          enabled=1
          gpgkey=https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official-SHA256
          gpgcheck=1" > /etc/yum.repos.d/appstream.repo

          echo "[extras]
          name=extras repo
          baseurl=https://vault.centos.org/8-stream/extras/x86_64/extras-common/
          enabled=1
          gpgkey=https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official-SHA256
          gpgcheck=1" > /etc/yum.repos.d/extras.repo

          dnf clean all

      - name: Install dependencies packages
        run: dnf install rpmdevtools rpmlint -y

      - name: Create build environment
        run: |
          mkdir -p $HOME/rpmbuild/BUILD
          mkdir -p $HOME/rpmbuild/BUILDROOT
          mkdir -p $HOME/rpmbuild/RPMS
          mkdir -p $HOME/rpmbuild/SOURCES
          mkdir -p $HOME/rpmbuild/SPECS
          mkdir -p /etc/linupdate/modules
          mkdir -p /opt/linupdate
          mkdir -p /opt/linupdate/src/
          mkdir -p /opt/linupdate/templates/
          mkdir -p /lib/systemd/system/

      - name: Copy files to include in the build
        run: |
          cp -r ${GITHUB_WORKSPACE}/src/* /opt/linupdate/src/
          cp -r ${GITHUB_WORKSPACE}/templates/* /opt/linupdate/templates/
          cp ${GITHUB_WORKSPACE}/linupdate.py /opt/linupdate/linupdate.py
          cp ${GITHUB_WORKSPACE}/service.py /opt/linupdate/service.py
          cp ${GITHUB_WORKSPACE}/version /opt/linupdate/version
          cp ${GITHUB_WORKSPACE}/templates/linupdate.systemd.template /lib/systemd/system/linupdate.service

      - name: Copy spec file
        run: |
          cp ${GITHUB_WORKSPACE}/.github/workflows/packaging/rpm/spec $HOME/rpmbuild/SPECS/linupdate.spec
          sed -i "s/__VERSION__/${{ env.VERSION }}/g" $HOME/rpmbuild/SPECS/linupdate.spec

      # Changelog of the current version, from CHANGELOG.md
      - name: Generate changelog
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/generate-changelog.sh rpm /tmp/linupdate-changelog && cat /tmp/linupdate-changelog >> $HOME/rpmbuild/SPECS/linupdate.spec

      - name: Build package
        run: |
          cd $HOME/rpmbuild/SPECS
          rpmbuild --target noarch -bb linupdate.spec
          mv $HOME/rpmbuild/RPMS/noarch/linupdate-${{ env.VERSION }}-stable.noarch.rpm /tmp/linupdate-test-build-${{ env.VERSION }}.noarch.rpm

      # Fail on new rpmlint errors (the accepted ones are filtered in rpmlintrc)
      - name: Check package with rpmlint
        run: rpmlint -f ${GITHUB_WORKSPACE}/.github/workflows/packaging/rpm/rpmlintrc /tmp/linupdate-test-build-${{ env.VERSION }}.noarch.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linupdate-test-build-${{ env.VERSION }}.noarch.rpm
          path: /tmp/linupdate-test-build-${{ env.VERSION }}.noarch.rpm
          retention-days: 1


  # Upload rpm package to test repositories
  upload:
    name: Upload rpm package to test repositories
    needs:
      - build-rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      # Download builded rpm package artifact
      - name: Download rpm artifact
        uses: actions/download-artifact@v8
        with:
          name: linupdate-test-build-${{ env.VERSION }}.noarch.rpm
          path: ~/assets

      # Upload package to test repositories
      - name: Upload packages to test repositories
        run: |
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build-${{ env.VERSION }}.noarch.rpm" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/1022/upload
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build-${{ env.VERSION }}.noarch.rpm" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/980/upload
          curl --fail-with-body -L --post301 -s -q -X POST -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -F "files=@$HOME/assets/linupdate-test-build-${{ env.VERSION }}.noarch.rpm" -F "overwrite=true" ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/981/upload

      # Rebuild repositories metadata
      - name: Rebuild repositories
        run: |
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/1022/rebuild
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/980/rebuild
          curl --fail-with-body -X PUT -H "Authorization: Bearer ${{ secrets.REPOSITORY_UPLOAD_TOKEN }}" -d '{"gpgSign":"true"}' ${{ secrets.REPOSITORY_UPLOAD_URL }}/api/v2/snapshot/981/rebuild


  # Install the package and run the test suite on different distributions
  # (the OS specific preparation is done by .github/scripts/setup-system.sh)
  install-and-test:
    name: Install and test on ${{ matrix.name }}
    needs:
      - build-rpm
      - upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # EOL
          - name: CentOS 8
            image: centos:8
          - name: Fedora 40
            image: fedora:40
          - name: Fedora 41
            image: fedora:41
          - name: Fedora 42
            image: fedora:42
          - name: Fedora 43
            image: fedora:43
          - name: Fedora 44
            image: fedora:44
          - name: Rocky Linux 9
            image: rockylinux/rockylinux:9
          # Rocky Linux 10: no docker image available yet
          - name: Alma Linux 9
            image: almalinux:9
          - name: Alma Linux 10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      - name: Prepare system
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/setup-system.sh

      # Download builded package artifact
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: linupdate-test-build-${{ env.VERSION }}.noarch.rpm

      - name: Install package
        run: dnf --nogpgcheck install -y ./linupdate-test-build-${{ env.VERSION }}.noarch.rpm

      # Run common test suite (shared across all distributions)
      - name: Run test suite
        env:
          REPOSITORY_TEST_URL: ${{ secrets.REPOSITORY_TEST_URL }}
          REPOSITORY_TEST_TOKEN: ${{ secrets.REPOSITORY_TEST_TOKEN }}
          REPOS_CONFIG_DIR: /etc/yum.repos.d
          LINUPDATE_PROFILE: linupdate-ci-rhel-systems
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/run-tests.sh

  # Upgrade from the latest release, systemd service and uninstall tests, in a container running systemd
  package-tests:
    name: Package tests on ${{ matrix.name }}
    needs:
      - build-rpm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Alma Linux 9
            image: almalinux:9
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get linupdate version
        run: echo "VERSION=$(cat ${GITHUB_WORKSPACE}/version)" >> $GITHUB_ENV

      # Download builded package artifact
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: linupdate-test-build-${{ env.VERSION }}.noarch.rpm
          path: packages/new

      - name: Download the latest released package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern '*.noarch.rpm' --dir packages/old

      - name: Start a container running systemd
        run: bash .github/scripts/start-systemd-container.sh "${{ matrix.image }}" linupdate-systemd

      - name: Run package tests
        env:
          REPOSITORY_TEST_URL: ${{ secrets.REPOSITORY_TEST_URL }}
          REPOSITORY_TEST_TOKEN: ${{ secrets.REPOSITORY_TEST_TOKEN }}
        run: |
          docker exec -e REPOSITORY_TEST_URL -e REPOSITORY_TEST_TOKEN linupdate-systemd \
            bash /src/.github/scripts/run-package-tests.sh /src/packages/new/linupdate-test-build-${{ env.VERSION }}.noarch.rpm /src/packages/old

      - name: Print the service journal
        if: always()
        run: docker exec linupdate-systemd journalctl -u linupdate --no-pager --all || true
